#clear-linux-config
# A minimal UEFI install in clr-installer's config format, which
# slinstaller reads directly. Print its plan with:
#
#     slinstaller demo/uefi-basic.yaml
#
# Nothing runs until you pass --apply, and even then slinstaller makes
# you retype the disk path first.

targetMedia:
- name: sda
  type: disk
  children:
  # The ESP. vfat at /boot marks it the EFI System Partition.
  - name: sda1
    type: part
    fstype: vfat
    mountpoint: /boot
    size: 512M
  # Swap, created but not mounted.
  - name: sda2
    type: part
    fstype: swap
    size: 2G
  # Root.
  - name: sda3
    type: part
    fstype: ext4
    mountpoint: /
    size: 20G

keyboard: us
language: en_US.UTF-8
hostname: sunlight
timezone: UTC

# Clear Linux specifics a clr-installer config carries. slinstaller loads
# them without error; they do not yet drive a Sunlight install.
bundles: [os-core]
telemetry: false
kernel: kernel-native
