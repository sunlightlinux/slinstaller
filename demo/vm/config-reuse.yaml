#clear-linux-config
# Reuse-partitions demo (reusePartitions: install into the disk's EXISTING
# partitions without repartitioning). Run this AFTER a normal install has
# already laid down vda1/vda2/vda3 on the VM disk — e.g. install once with
# demo/vm/config.yaml, then re-run with this config.
#
# What it does: the partition table is left untouched; vda1 (the ESP) is
# KEPT as-is (preserve: true — its data survives, a shared /boot), while
# vda3 (root) is reformatted and vda2 stays swap. No sizes are given: in a
# reuse install the partitions already exist, so sizes are ignored.
#
# Only plain partitions are supported in reuse mode (no crypt/lvm/raid).

reusePartitions: true

targetMedia:
- name: vda
  type: disk
  children:
  - name: vda1
    type: part
    fstype: vfat
    mountpoint: /boot
    preserve: true        # keep the existing ESP, do not reformat it
  - name: vda2
    type: part
    fstype: swap          # reformatted as swap
  - name: vda3
    type: part
    fstype: ext4
    mountpoint: /         # reformatted — a clean reinstall of the root

hostname: sunlight-reuse
timezone: UTC
keyboard: us
language: en_US.UTF-8

