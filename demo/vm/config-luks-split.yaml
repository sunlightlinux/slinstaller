#clear-linux-config
# The hard one: a plain ESP and swap, then two separate LUKS containers —
# a btrfs root and an xfs /home — on /dev/vda. The ESP is at /boot (not
# /boot/efi), so the kernel lives on the unencrypted ESP and GRUB needs no
# cryptodisk; the initramfs unlocks both LUKS volumes with one passphrase
# (rd.luks.uuid for each), since the runit base has no crypttab service for
# the non-root one. Swap is left unencrypted here, as requested.
# User password is "demo"; the LUKS passphrase is prompted.
targetMedia:
- name: vda
  type: disk
  children:
  - { name: vda1, type: part,  fstype: vfat,  mountpoint: /boot, size: 512M }
  - { name: vda2, type: part,  fstype: swap,  size: 1G }
  - { name: vda3, type: crypt, fstype: btrfs, mountpoint: /,     size: 4G }
  - { name: vda4, type: crypt, fstype: xfs,   mountpoint: /home }
hostname: sunlight-split
keyboard: us
language: en_US.UTF-8
users:
- login: demo
  password: "$6$VSGJJlJ4HsRjJiL0$iOD.YPsE3bTdnzcjVnRcTiskHk8Qi3H2s9H6.p.b7N9n/OTajSFtM1B1j46w5L6wZiLyAmxmyXTzILnIvhetM0"
  admin: true
