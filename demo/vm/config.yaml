#clear-linux-config
# Demo install config for the VM, in clr-installer's format. It targets
# /dev/vda — the virtio disk run.sh attaches — so it is safe to --apply
# inside the VM and nowhere else.
#
# clr-installer configs give every partition an explicit size, and so
# does this one: the root is sized for the demo's 10G disk, not "the
# rest". Grow both here and DISK_SIZE in build.sh together.

targetMedia:
- name: vda
  type: disk
  children:
  - name: vda1
    type: part
    fstype: vfat
    mountpoint: /boot
    size: 512M
  - name: vda2
    type: part
    fstype: swap
    size: 1G
  - name: vda3
    type: part
    fstype: ext4
    mountpoint: /
    size: 8G

hostname: sunlight-demo
timezone: UTC
keyboard: us
language: en_US.UTF-8

# A demo account. The password is "demo" (this is a real SHA-512 crypt
# hash of it — regenerate your own with `openssl passwd -6`). admin puts
# it in the wheel group.
users:
- login: demo
  password: "$6$VSGJJlJ4HsRjJiL0$iOD.YPsE3bTdnzcjVnRcTiskHk8Qi3H2s9H6.p.b7N9n/OTajSFtM1B1j46w5L6wZiLyAmxmyXTzILnIvhetM0"
  admin: true

# Passwordless sudo for demo, via a post-install hook (a clr-installer
# config feature). It runs chrooted in the target, after the account
# exists, and writes a sudoers drop-in. sudo reads everything in
# /etc/sudoers.d; the 0440 mode is what sudo requires.
post-install:
- chroot: true
  cmd: "echo 'demo ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/demo && chmod 0440 /etc/sudoers.d/demo"
